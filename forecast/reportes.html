<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Meteorológico Diario | Meteoclima</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PDF.js para leer el PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- PageFlip para el efecto estilo Issuu -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        body {
            background-color: #0f172a; /* slate-900 */
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        /* Contenedor del libro */
        .flip-book {
            display: none; /* Oculto hasta que cargue */
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        /* Cada página del PDF */
        .page {
            background-color: white;
            overflow: hidden;
            border: solid 1px #cbd5e1;
        }

        /* Canvas donde se dibuja el PDF */
        .page canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Animación de carga */
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-slate-200">

    <!-- Header / Barra de Navegación -->
    <header class="bg-slate-900 shadow-[0_4px_15px_rgba(0,0,0,0.5)] p-4 flex justify-between items-center z-10 border-b border-slate-700">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🌦️</span>
            <div>
                <h1 class="text-xl font-bold text-white leading-tight">Reporte Meteorológico Diario</h1>
                <p class="text-xs text-slate-400 font-mono">Meteoclima Lab</p>
            </div>
        </div>

        <!-- Botón de Descarga -->
        <a href="https://raw.githubusercontent.com/okasakibot/meteoclima-data3/main/met_daily_report.pdf"
           download="met_daily_report.pdf"
           target="_blank"
           class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-5 rounded-lg shadow-lg transition flex items-center gap-2 border border-blue-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            Descargar PDF
        </a>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 flex flex-col justify-center items-center relative p-4 w-full">

        <!-- Indicador de Carga -->
        <div id="loading" class="flex flex-col items-center gap-4">
            <div class="loader"></div>
            <p class="text-slate-300 font-mono text-sm tracking-wide" id="loading-text">Descargando reporte...</p>
        </div>

        <!-- Contenedor Flipbook -->
        <div id="book-container" class="relative w-full max-w-5xl flex justify-center items-center h-full">
            <div id="book" class="flip-book">
                <!-- Las páginas <canvas> se inyectarán aquí dinámicamente -->
            </div>
        </div>

        <!-- Controles de navegación inferiores (opcionales, también se puede arrastrar desde la esquina) -->
        <div id="controls" class="hidden absolute bottom-6 flex gap-4 z-20">
            <button id="btn-prev" class="bg-slate-800/80 hover:bg-slate-700 text-white px-4 py-2 rounded-l-full font-bold backdrop-blur border border-slate-600 shadow-lg">&larr; Anterior</button>
            <span class="bg-slate-800/80 text-white px-4 py-2 font-mono text-sm backdrop-blur border-y border-slate-600 flex items-center">
                Pág <span id="current-page" class="mx-1 text-blue-400 font-bold">1</span> de <span id="total-pages" class="ml-1 font-bold">?</span>
            </span>
            <button id="btn-next" class="bg-slate-800/80 hover:bg-slate-700 text-white px-4 py-2 rounded-r-full font-bold backdrop-blur border border-slate-600 shadow-lg">Siguiente &rarr;</button>
        </div>

    </main>

    <script>
        // Configurar el worker de PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // URL Directa al PDF Actualizada
        const pdfUrl = 'https://raw.githubusercontent.com/okasakibot/meteoclima-data3/main/met_daily_report.pdf';

        const bookElement = document.getElementById('book');
        const loadingUI = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const controls = document.getElementById('controls');

        async function renderFlipbook() {
            try {
                // 1. Descargar el documento PDF
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const numPages = pdf.numPages;

                document.getElementById('total-pages').innerText = numPages;

                // 2. Extraer dimensiones de la primera página para configurar el libro
                const firstPage = await pdf.getPage(1);
                // Usamos un scale alto (1.5 o 2.0) para que la resolución sea nítida
                const viewport = firstPage.getViewport({ scale: 1.5 });

                // 3. Renderizar cada página en un elemento Canvas
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    loadingText.innerText = `Renderizando página ${pageNum} de ${numPages}...`;

                    const page = await pdf.getPage(pageNum);
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const pageViewport = page.getViewport({ scale: 1.5 });
                    canvas.height = pageViewport.height;
                    canvas.width = pageViewport.width;

                    const renderContext = {
                        canvasContext: ctx,
                        viewport: pageViewport
                    };

                    // Esperar a que se dibuje el canvas
                    await page.render(renderContext).promise;

                    // Crear el div contenedor de la página para el Flipbook
                    const pageContainer = document.createElement('div');
                    pageContainer.className = 'page';
                    pageContainer.appendChild(canvas);
                    bookElement.appendChild(pageContainer);
                }

                // 4. Ocultar estado de carga
                loadingUI.style.display = 'none';
                bookElement.style.display = 'block';
                controls.classList.remove('hidden');

                // 5. Inicializar la librería PageFlip (StPageFlip)
                const pageFlip = new St.PageFlip(bookElement, {
                    width: viewport.width, // Anchura base de la hoja
                    height: viewport.height, // Altura base de la hoja
                    size: "stretch", // <-- CORRECCIÓN: "stretch" permite adaptabilidad sin causar el error
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1200,
                    showCover: true, // Efecto de portada dura
                    maxShadowOpacity: 0.5,
                    usePortrait: true // En móviles, muestra una sola página
                });

                // Cargar los divs renderizados
                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                // Eventos de botones
                document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());

                // Actualizar número de página inferior
                pageFlip.on('flip', (e) => {
                    document.getElementById('current-page').innerText = e.data + 1;
                });

            } catch (error) {
                console.error('Error procesando el PDF:', error);
                loadingUI.innerHTML = `<p class="text-red-400 font-bold">⚠️ Error al cargar el documento.</p>`;
            }
        }

        // Iniciar
        renderFlipbook();
    </script>
</body>
</html>
